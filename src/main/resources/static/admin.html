<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ табло · CineReserve</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="admin-body">
    <header class="topbar"></header>

    <div class="admin-shell">
        <aside class="admin-sidebar" id="adminSidebar"></aside>

        <main class="admin-main admin-main--home">
            <p class="admin-eyebrow">Админ панел</p>
            <h1 id="adminGreeting">Здравей!</h1>
            <p class="muted admin-welcome">
                Избери секция отляво, за да управляваш кината, програмата, бара и отчетите.
            </p>
        </main>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/toast.js"></script>
    <script src="/js/parallax.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/admin-layout.js"></script>
    <script>
        mountAdminSidebar('home');
        (async () => {
            const user = await mountAppNav({ showAdmin: true });
            if (user && user.username) {
                setAdminGreeting(user.username);
            } else {
                await initAdminHome();
            }
            revealAdminPage();
        })();
    </script>
</body>
</html>
