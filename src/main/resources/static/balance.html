<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Баланс · CineReserve</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header class="topbar"></header>
    <main class="container balance-page">
        <h1>Баланс</h1>
        <p class="muted">Зареди пари, за да можеш да плащаш билети онлайн.</p>

        <div class="stat-row balance-stat">
            <div class="stat-card">
                <span class="label">Текущ баланс</span>
                <span class="value" id="balanceValue">—</span>
            </div>
        </div>

        <form class="panel balance-form" id="topUpForm">
            <label>Сума за зареждане (€)</label>
            <input id="amount" type="number" min="1" step="0.01" value="20" required>
            <div class="actions">
                <button class="btn" type="submit">Зареди</button>
                <button class="btn btn-secondary" type="button" data-amt="10">+10</button>
                <button class="btn btn-secondary" type="button" data-amt="20">+20</button>
                <button class="btn btn-secondary" type="button" data-amt="50">+50</button>
            </div>
            <div id="msg" class="msg"></div>
        </form>
    </main>
    <script src="/js/api.js"></script>
    <script src="/js/parallax.js"></script>
    <script src="/js/nav.js"></script>
    <script>
        async function refresh() {
            const user = await mountAppNav({ active: 'balance' });
            if (user) {
                document.getElementById('balanceValue').textContent = Number(user.balance).toFixed(2) + ' €';
            }
        }
        refresh();

        document.querySelectorAll('[data-amt]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.getElementById('amount').value = btn.dataset.amt;
            });
        });

        document.getElementById('topUpForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('msg');
            try {
                const data = await api('/api/account/top-up', {
                    method: 'POST',
                    body: JSON.stringify({ amount: Number(document.getElementById('amount').value) })
                });
                document.getElementById('balanceValue').textContent = Number(data.balance).toFixed(2) + ' €';
                showMsg(msg, 'Балансът е обновен.', true);
                await mountAppNav({ active: 'balance' });
            } catch (err) {
                showMsg(msg, err.message, false);
            }
        });
    </script>
</body>
</html>
